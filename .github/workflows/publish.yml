name: Publish OpenPMM CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, pack, and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Test
        run: npm test

      - name: Verify tag matches package version
        run: >-
          node -e "const p=require('./package.json');
          const expected='v'+p.version;
          if(process.env.GITHUB_REF_NAME!==expected)
          throw new Error('Expected tag '+expected)"

      - name: Verify production API coverage
        run: npm run check:api-coverage

      - name: Verify package contents
        run: npm run pack

      - name: Publish with provenance
        run: npm publish --access public --provenance
